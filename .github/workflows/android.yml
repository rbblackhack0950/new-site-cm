# Builds the Car Screen Android app and publishes the APK as the "android-latest" release,
# downloadable at https://github.com/rbblackhack0950/new-site-cm/releases/download/android-latest/car-screen.apk
name: Android APK

# Manual only: the APK is normally built with android/build-apk.sh and served from dist/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk car-screen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: car-screen-apk
          path: car-screen.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Car Screen Android (ล่าสุด)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            ดาวน์โหลด car-screen.apk ด้านล่างแล้วเปิดเพื่อติดตั้ง
            Build ${{ github.run_number }} from ${{ github.ref_name }} (${{ github.sha }})
          files: car-screen.apk
