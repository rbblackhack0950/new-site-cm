<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0c0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Screen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Car Screen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/192.png">
<link rel="apple-touch-icon" href="icons/192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ===== Map / navigation ===== -->
  <section id="mapPane" class="pane">
    <div id="map"></div>

    <form id="search" class="glass pill autohide" autocomplete="off">
      <span class="ic" data-i="search"></span>
      <input id="q" type="search" placeholder="ไปที่ไหนดี" enterkeyhint="search" aria-label="ค้นหาปลายทาง">
      <button type="button" id="qClear" class="btn ghost" hidden aria-label="ล้าง" data-i="close"></button>
    </form>
    <div id="results" class="glass card list" hidden></div>

    <div id="gmCard" class="glass card" hidden>
      <div class="rc-head">
        <div class="grow"><div class="sub">เลือกจาก Google Maps</div><div id="gmName" class="title"></div></div>
        <button id="gmClose" class="btn ghost" aria-label="ปิด" data-i="close"></button>
      </div>
      <button id="gmGo" class="btn primary"><span class="ic" data-i="nav"></span>ไปที่นี่</button>
    </div>
    <div id="routeCard" class="glass card" hidden>
      <div class="rc-head">
        <div class="grow">
          <div id="rcName" class="title"></div>
          <div id="rcMeta" class="sub"></div>
        </div>
        <button id="rcClose" class="btn ghost" aria-label="ยกเลิก" data-i="close"></button>
      </div>
      <div id="rcAlts" class="alts"></div>
      <div class="row">
        <button id="rcGo" class="btn primary grow"><span class="ic" data-i="nav"></span>เริ่มนำทาง</button>
        <button id="rcOpts" class="btn round" aria-label="ตัวเลือกเส้นทาง" data-i="tune"></button>
        <button id="rcGmaps" class="btn round" aria-label="เปิดใน Google Maps" data-i="open"></button>
      </div>
    </div>

    <div id="navBanner" hidden>
      <div class="nb-main">
        <span id="nbArrow" class="nb-arrow"></span>
        <div class="grow">
          <div id="nbDist" class="nb-dist"></div>
          <div id="nbText" class="nb-text"></div>
        </div>
      </div>
      <div id="nbThen" class="nb-then" hidden></div>
    </div>
    <div id="navFoot" class="glass" hidden>
      <div class="grow">
        <div id="nfEta" class="nf-eta"></div>
        <div id="nfMeta" class="sub"></div>
      </div>
      <button id="nfVoice" class="btn ghost round" aria-label="เสียงนำทาง" data-i="vol"></button>
      <button id="nfStop" class="btn danger round" aria-label="หยุดนำทาง" data-i="close"></button>
    </div>
    <div id="speed" class="glass" hidden><b>0</b><small>กม./ชม.</small></div>

    <div class="fabs">
      <button id="recenter" class="btn glass round autohide" aria-label="ตำแหน่งของฉัน" data-i="loc"></button>
    </div>
  </section>

  <div id="divider" role="separator" aria-label="ลากเพื่อปรับขนาด"><i></i></div>

  <!-- ===== Media ===== -->
  <section id="mediaPane" class="pane">
    <div id="home" class="view">
      <div class="home-grid" id="tiles"></div>
    </div>

    <div id="yt" class="view" hidden>
      <div class="reveal"></div>
      <form id="ytForm" class="topbar autohide" autocomplete="off">
        <button type="button" class="btn ghost round homeBtn" aria-label="แอปทั้งหมด" data-i="apps"></button>
        <div class="glass pill grow">
          <span class="ic" data-i="search"></span>
          <input id="ytQ" type="search" placeholder="ค้นหา YouTube หรือวางลิงก์" enterkeyhint="search" aria-label="ค้นหา YouTube">
        </div>
        <button type="button" id="ytListBtn" class="btn ghost round" aria-label="รายการวิดีโอ" data-i="list" hidden></button>
        <button type="button" id="ytFs" class="btn ghost round" aria-label="เต็มจอเฉพาะฝั่งนี้" data-i="fs" hidden></button>
      </form>
      <div id="ytStage" hidden>
        <div id="ytHost"></div>
        <div id="ytErr" class="overlay" hidden>
          <p id="ytErrMsg"></p>
          <div class="row">
            <button id="ytErrOpen" class="btn primary"><span class="ic" data-i="open"></span>เปิดใน YouTube</button>
            <button id="ytErrNext" class="btn">ถัดไป</button>
          </div>
        </div>
      </div>
      <div id="ytList" class="vlist"></div>
    </div>

    <div id="web" class="view" hidden>
      <div class="reveal"></div>
      <form id="webForm" class="topbar autohide" autocomplete="off">
        <button type="button" class="btn ghost round homeBtn" aria-label="แอปทั้งหมด" data-i="apps"></button>
        <div class="glass pill grow">
          <span class="ic" data-i="globe"></span>
          <input id="webQ" type="text" inputmode="url" autocapitalize="off" placeholder="พิมพ์ URL หรือคำค้นหา" aria-label="URL หรือคำค้นหา" enterkeyhint="go">
        </div>
        <button type="button" id="webPop" class="btn ghost round" aria-label="เปิดในหน้าต่างใหม่" data-i="open"></button>
      </form>
      <iframe id="webFrame" title="เว็บ" allow="autoplay; picture-in-picture; encrypted-media"></iframe>
      <div id="webMsg" class="overlay web-msg" hidden></div>
    </div>
  </section>
</div>

<!-- ===== Floating controls ===== -->
<div id="dock">
  <div id="dockBar" class="glass" hidden>
    <div class="seg" role="group" aria-label="มุมมอง">
      <button data-mode="map" aria-label="แผนที่เต็มจอ" data-i="map"></button>
      <button data-mode="split" aria-label="แบ่งจอ" data-i="split"></button>
      <button data-mode="media" aria-label="แอปเต็มจอ" data-i="play"></button>
    </div>
    <button id="swap" class="btn ghost round" aria-label="สลับฝั่ง" data-i="swap"></button>
    <button id="orient" class="btn ghost round" aria-label="แนวตั้ง/แนวนอน" data-i="split"></button>
    <button id="fs" class="btn ghost round" aria-label="เต็มจอ" data-i="fs"></button>
    <button id="ytFsExit" class="btn ghost round" aria-label="ออกจากเต็มจอวิดีโอ" data-i="fsx" hidden></button>
    <button id="install" class="btn ghost round" aria-label="ติดตั้งแอป" data-i="dl" hidden></button>
    <button id="settingsBtn" class="btn ghost round" aria-label="ตั้งค่า" data-i="tune"></button>
  </div>
  <button id="dockToggle" class="glass" aria-label="เมนู" data-i="more"></button>
</div>

<div id="sheetWrap" hidden>
  <div id="sheet" class="glass card" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" role="status" hidden></div>

<script>
// ES5 on purpose, so it runs on any engine. If app.js fails to start, explain what happened instead of
// leaving a blank screen: the real error when there is one, "too old" only when the engine really is,
// and "slow" when nothing has failed yet. The notice removes itself if the app starts after all.
(function () {
  var errs = window.__bootErrs = [], t0 = Date.now(), shown = null;
  addEventListener('error', function (e) {
    var el = e.target;
    if (el && el !== window && (el.src || el.href)) errs.push('โหลดไฟล์ไม่สำเร็จ: ' + (el.src || el.href).split('/').pop());
    else errs.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : ''));
  }, true);
  function repair() {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    setTimeout(function () { location.reload(); }, 800);
  }
  function show() {
    var m = navigator.userAgent.match(/Chrome\/(\d+)/), v = m ? +m[1] : 0, old = v && v < 85;
    var d = document.createElement('div');
    d.id = 'bootFail';
    d.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;overflow:auto;background:#0c0d10;color:#eef0f3;font:18px/1.5 sans-serif;padding:32px');
    var btn = 'style="font:inherit;font-weight:600;color:#eef0f3;background:#262930;border:0;border-radius:24px;padding:12px 22px;margin:0 8px 8px 0"';
    d.innerHTML = '<h2 style="margin:0 0 12px">Car Screen เปิดไม่ขึ้น</h2>' +
      (old ? '<p>ตัวแสดงเว็บของเครื่อง (Chrome/WebView) เวอร์ชัน <b>' + v + '</b> เก่าเกินไป ต้องเป็นเวอร์ชัน 85 ขึ้นไป ลองอัปเดต “Android System WebView” หรือ Chrome</p>'
        : errs.length ? '<p>เกิดข้อผิดพลาดตอนเปิดแอป ลองกด “ลองใหม่” หรือ “ซ่อมแอป”</p>'
        : '<p>แอปใช้เวลาโหลดนานผิดปกติ อินเทอร์เน็ตอาจช้าหรือหลุด ลองกด “ลองใหม่”</p>') +
      '<p><button ' + btn + ' id="bootRetry">ลองใหม่</button><button ' + btn + ' id="bootRepair">ซ่อมแอป</button></p>' +
      '<p>ถ้ายังไม่ได้ ถ่ายภาพหน้าจอนี้ส่งให้ผู้พัฒนา</p>' +
      '<p style="color:#9aa1ac;font-size:13px;word-break:break-all">' + (errs.length ? 'ข้อผิดพลาด: ' + errs.slice(0, 3).join(' | ').replace(/</g, '&lt;') + '<br>' : '') +
      'WebView ' + (v || '?') + ' · ' + navigator.userAgent.replace(/</g, '&lt;') + '</p>';
    document.body.appendChild(d);
    document.getElementById('bootRetry').onclick = function () { location.reload(); };
    document.getElementById('bootRepair').onclick = repair;
    return d;
  }
  var timer = setInterval(function () {
    var age = Date.now() - t0;
    if (window.__car) { if (shown) shown.parentNode.removeChild(shown); clearInterval(timer); return; }
    if (!shown && ((errs.length && age > 2500) || age > 25000)) shown = show();
    if (age > 120000) clearInterval(timer);
  }, 500);
})();
</script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
