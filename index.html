<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#000000">
<title>Car Screen</title>
<link rel="icon" href="icons/192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <!-- ===== Map & navigation ===== -->
    <section id="mapPane" class="pane">
      <div id="map"></div>

      <!-- Everything over the map lives in one column (top: search or turn banner, middle: panel, bottom: route card or trip bar),
           so nothing can sit on top of anything else. The column ignores touches except on the controls themselves. -->
      <div id="mapUI">
        <div class="ui-top">
          <div class="ui-col">
            <form id="search" class="autohide" autocomplete="off">
              <span class="ic" data-i="search"></span>
              <input id="q" type="search" placeholder="ไปที่ไหน" enterkeyhint="search" aria-label="ค้นหาปลายทาง">
              <button type="button" id="qClear" class="icon-btn" hidden aria-label="ล้าง" data-i="close"></button>
              <span class="quick">
                <button type="button" id="qHome" class="icon-btn" aria-label="บ้าน" data-i="home"></button>
                <button type="button" id="qWork" class="icon-btn" aria-label="ที่ทำงาน" data-i="work"></button>
              </span>
            </form>
            <div id="results" class="list" hidden></div>

            <div id="navBanner" hidden>
              <div class="nb-main">
                <span id="nbArrow" class="nb-arrow"></span>
                <div class="grow">
                  <div id="nbDist" class="nb-dist"></div>
                  <div id="nbText" class="nb-text"></div>
                </div>
              </div>
              <div id="nbThen" class="nb-then" hidden></div>
            </div>

            <div class="ui-chips">
              <button id="stopMode" class="chip-btn" hidden><span class="ic" data-i="addStop"></span><span id="stopModeT">เลือกจุดแวะ: ค้นหาหรือกดค้างบนแผนที่</span> <span class="ic" data-i="close"></span></button>
              <button id="gmTab" class="chip-btn" hidden><span class="ic" data-i="search"></span>Google Maps</button>
            </div>
          </div>
          <button id="compass" class="fab small" aria-label="ทิศทางแผนที่" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l4.2 10h-8.4z" fill="#e82127"/><path d="M12 22l-4.2-10h8.4z" fill="#f5f5f7"/></svg></button>
        </div>

        <div class="ui-gap"></div>

        <!-- Places along the way: chargers, fuel, food, toilets, parking (OpenStreetMap data) -->
        <div id="evCard" class="card" hidden>
          <div class="ev-head">
            <span class="ic ev-ic" id="evIc" data-i="bolt"></span>
            <div class="grow rc-name" id="evTitle">ที่ชาร์จ</div>
            <button id="evX" class="icon-btn" aria-label="ปิด" data-i="close"></button>
          </div>
          <div id="evCats" class="ev-cats"></div>
          <div class="row ev-filters">
            <div class="seg" id="evWhere">
              <button data-where="near" class="on">ใกล้ฉัน</button>
              <button data-where="route">ระหว่างทาง</button>
            </div>
            <button id="evDc" class="chip-btn" aria-pressed="false">ชาร์จเร็ว DC</button>
          </div>
          <div id="evList" class="ev-list"></div>
          <div class="ev-foot">
            <button id="evGoogle" class="btn ghost small-btn">ไม่เจอ? ค้นใน Google Maps</button>
            <div class="ev-credit muted">ข้อมูลชาร์จ DC: ปิยเมษฐ์ วิษณุเวช · OpenStreetMap</div>
          </div>
        </div>

        <div class="ui-bottom">
          <div class="ui-stack">
            <div id="routeCard" class="card" hidden>
              <div class="rc-head">
                <div class="grow">
                  <div id="rcName" class="rc-name"></div>
                  <div id="rcMeta" class="muted"></div>
                </div>
                <button id="rcClose" class="icon-btn" aria-label="ยกเลิกปลายทาง" data-i="close"></button>
              </div>
              <div id="rcStops" class="stops"></div>
              <div id="rcAlts" class="alts"></div>
              <div class="row">
                <button id="rcGo" class="btn primary grow"><span class="ic" data-i="nav"></span>เริ่มนำทาง</button>
                <button id="rcAddStop" class="btn square" aria-label="เพิ่มจุดแวะ" data-i="addStop"></button>
                <button id="rcOpts" class="btn square" aria-label="ตัวเลือกเส้นทาง" data-i="tune"></button>
              </div>
            </div>
            <div id="navFoot" class="card" hidden>
              <div id="speed"><b>0</b><small>กม./ชม.</small></div>
              <div class="grow">
                <div id="nfEta" class="nf-eta"></div>
                <div id="nfMeta" class="muted"></div>
              </div>
              <button id="nfSteps" class="icon-btn" aria-label="ขั้นตอนและภาพรวมเส้นทาง" data-i="list"></button>
              <button id="nfEv" class="icon-btn" aria-label="ค้นหาตามเส้นทาง" data-i="search"></button>
              <button id="nfVoice" class="icon-btn" aria-label="เสียงนำทาง" data-i="vol"></button>
              <button id="nfStop" class="btn danger" aria-label="หยุดนำทาง">หยุด</button>
            </div>
          </div>
          <div class="ui-fabs">
            <button id="evBtn" class="fab autohide" aria-label="ที่ชาร์จและสถานที่ตามทาง" data-i="bolt"></button>
            <button id="recenter" class="fab autohide" aria-label="ตำแหน่งของฉัน" data-i="loc"></button>
          </div>
        </div>
      </div>

      <!-- Google Maps tab: the app lays a browser view over #gmHost -->
      <div id="gmPanel" hidden>
        <div class="gm-bar">
          <div class="seg" role="tablist">
            <button id="gmToMap" role="tab">แผนที่</button>
            <button class="on" role="tab" aria-selected="true">Google Maps</button>
          </div>
          <div id="gmTitle" class="grow muted ellipsis"></div>
          <button id="gmX" class="icon-btn" aria-label="ปิด Google Maps" data-i="close"></button>
        </div>
        <div id="gmHost"></div>
        <div id="gmPick" class="gm-pick" hidden>
          <div class="grow"><div class="muted small">สถานที่ที่เลือก</div><div id="gmPickName" class="rc-name ellipsis"></div></div>
          <button id="gmPickGo" class="btn primary"><span class="ic" data-i="nav"></span>ไปที่นี่</button>
        </div>
      </div>
    </section>

    <div id="divider" role="separator" aria-label="ลากเพื่อปรับขนาด"><i></i></div>

    <!-- ===== Media ===== -->
    <section id="mediaPane" class="pane">
      <div id="home" class="view">
        <div class="home-head">
          <h1>แอป</h1>
          <button id="editApps" class="btn ghost small-btn">แก้ไข</button>
        </div>
        <div id="tiles" class="tiles"></div>
        <div id="noNative" class="muted center" hidden>
          เปิดแอปในฝั่งนี้ได้ในแอป Android ของ Car Screen
          <a href="dist/car-screen.apk">ดาวน์โหลดแอป</a>
        </div>
      </div>

      <div id="appView" class="view" hidden>
        <form id="addr" class="addr" autocomplete="off">
          <button type="button" id="appHome" class="icon-btn" aria-label="แอปทั้งหมด" data-i="apps"></button>
          <button type="button" id="appBack" class="icon-btn" aria-label="ย้อนกลับ" data-i="back"></button>
          <input id="addrQ" type="text" inputmode="url" autocapitalize="off" placeholder="พิมพ์เว็บหรือคำค้นหา" aria-label="ที่อยู่เว็บ" enterkeyhint="go">
          <button type="button" id="appReload" class="icon-btn" aria-label="โหลดใหม่" data-i="reload"></button>
        </form>
        <div id="paneHost"></div>
      </div>
    </section>
  </main>

  <!-- ===== Bottom bar ===== -->
  <nav id="bar">
    <div class="bar-left">
      <button id="settingsBtn" class="bar-btn" aria-label="ตั้งค่า" data-i="gear"></button>
      <div class="seg" role="group" aria-label="มุมมอง">
        <button data-mode="map" aria-label="แผนที่เต็มจอ" data-i="map"></button>
        <button data-mode="split" aria-label="แบ่งจอ" data-i="split"></button>
        <button data-mode="media" aria-label="แอปเต็มจอ" data-i="apps"></button>
      </div>
    </div>
    <div id="dock" class="bar-apps"></div>
    <div id="clock" class="clock"></div>
  </nav>
</div>

<div id="sheetWrap" hidden>
  <div id="sheet" class="card" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" role="status" hidden></div>
<div id="snack" role="status" hidden><span id="snackText"></span><button id="snackUndo">เลิกทำ</button></div>

<script>
// ES5 on purpose, so it runs on any engine. If app.js fails to start, explain what happened instead of
// leaving a blank screen: the real error when there is one, "too old" only when the engine really is,
// and "slow" when nothing has failed yet. The notice removes itself if the app starts after all.
(function () {
  var errs = window.__bootErrs = [], t0 = Date.now(), shown = null;
  window.__want = 36; // must equal BUILD in app.js
  addEventListener('error', function (e) {
    var el = e.target;
    if (el && el !== window && (el.src || el.href)) errs.push('โหลดไฟล์ไม่สำเร็จ: ' + (el.src || el.href).split('/').pop());
    else errs.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : ''));
  }, true);
  function repair() {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    setTimeout(function () { location.reload(); }, 800);
  }
  function show() {
    var m = navigator.userAgent.match(/Chrome\/(\d+)/), v = m ? +m[1] : 0, old = v && v < 85;
    var d = document.createElement('div');
    d.id = 'bootFail';
    d.setAttribute('style', 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;overflow:auto;background:#000;color:#fff;font:18px/1.5 sans-serif;padding:32px');
    var btn = 'style="font:inherit;font-weight:600;color:#fff;background:#222;border:0;border-radius:24px;padding:12px 22px;margin:0 8px 8px 0"';
    d.innerHTML = '<h2 style="margin:0 0 12px">Car Screen เปิดไม่ขึ้น</h2>' +
      (old ? '<p>ตัวแสดงเว็บของเครื่อง (Chrome/WebView) เวอร์ชัน <b>' + v + '</b> เก่าเกินไป ต้องเป็นเวอร์ชัน 85 ขึ้นไป ลองอัปเดต “Android System WebView” หรือ Chrome</p>'
        : errs.length ? '<p>เกิดข้อผิดพลาดตอนเปิดแอป ลองกด “ลองใหม่” หรือ “ซ่อมแอป”</p>'
        : '<p>แอปใช้เวลาโหลดนานผิดปกติ อินเทอร์เน็ตอาจช้าหรือหลุด ลองกด “ลองใหม่”</p>') +
      '<p><button ' + btn + ' id="bootRetry">ลองใหม่</button><button ' + btn + ' id="bootRepair">ซ่อมแอป</button></p>' +
      '<p>ถ้ายังไม่ได้ ถ่ายภาพหน้าจอนี้ส่งให้ผู้พัฒนา</p>' +
      '<p style="color:#8e8e93;font-size:13px;word-break:break-all">' + (errs.length ? 'ข้อผิดพลาด: ' + errs.slice(0, 3).join(' | ').replace(/</g, '&lt;') + '<br>' : '') +
      'WebView ' + (v || '?') + ' · ' + navigator.userAgent.replace(/</g, '&lt;') + '</p>';
    document.body.appendChild(d);
    document.getElementById('bootRetry').onclick = function () { location.reload(); };
    document.getElementById('bootRepair').onclick = repair;
    return d;
  }
  var timer = setInterval(function () {
    var age = Date.now() - t0;
    if (window.__car) { if (shown) shown.parentNode.removeChild(shown); clearInterval(timer); return; }
    // a start-up error is most often files from two releases mixed in the cache: repair once by itself
    var tried = false; try { tried = sessionStorage.getItem('carRepaired'); } catch (e) {}
    var cm = navigator.userAgent.match(/Chrome\/(\d+)/), tooOld = cm && +cm[1] < 85; // repairing cannot fix an old engine
    if (!shown && errs.length && age > 1500 && !tried && !tooOld) { try { sessionStorage.setItem('carRepaired', '1'); } catch (e) {} clearInterval(timer); shown = {}; return repair(); }
    if (!shown && ((errs.length && age > 2500) || age > 25000)) shown = show();
    if (age > 120000) clearInterval(timer);
  }, 500);
})();
</script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet/leaflet-rotate.js"></script>
<script src="app.js"></script>
</body>
</html>
